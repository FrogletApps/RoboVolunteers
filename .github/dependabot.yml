version: 2
updates:
  # Flutter / Dart packages
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-flutter)"
    labels:
      - "dependencies"
      - "flutter"

  # Root workspace npm packages (Wrangler / tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-root)"
    labels:
      - "dependencies"

  # Auth OTP Cloudflare Worker npm packages
  - package-ecosystem: "npm"
    directory: "/workers/auth-otp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-worker)"
    labels:
      - "dependencies"
      - "worker"

  # Android Gradle dependencies & plugins
  - package-ecosystem: "gradle"
    directory: "/app/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-gradle)"
    labels:
      - "dependencies"
      - "android"

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-actions)"
    labels:
      - "dependencies"
      - "github-actions"
